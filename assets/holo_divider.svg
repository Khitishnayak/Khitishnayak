<svg xmlns="http://www.w3.org/2000/svg" width="900" height="12" viewBox="0 0 900 12" fill="none">
  <defs>
    <linearGradient id="laserPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="65%" stop-color="#8b5cf6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    @keyframes sweep {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1100px); }
    }
    .beam {
      animation: sweep 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Track -->
  <line x1="20" y1="6" x2="880" y2="6" stroke="#161f30" stroke-width="1.5" />
  
  <!-- Precision Center Reticle Diamond -->
  <g transform="translate(450, 6)">
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#00f0ff" opacity="0.8" />
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
  </g>

  <!-- Animated Laser Beam Pulse -->
  <rect class="beam" x="0" y="4.5" width="240" height="3" rx="1.5" fill="url(#laserPulse)" />
</svg>
