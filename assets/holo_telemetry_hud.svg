<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" fill="none">
  <defs>
    <linearGradient id="hudCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a17" />
      <stop offset="50%" stop-color="#080f24" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>

    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="barRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <pattern id="hudScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-opacity="0.2" stroke-width="1.5" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    @keyframes barPulse {
      0%, 100% { opacity: 0.92; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.4)); }
    }
    .meter {
      animation: barPulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Double Bezel Chassis -->
  <rect x="2" y="2" width="896" height="276" rx="16" fill="url(#hudCardBg)" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="1.5" />
  <rect x="8" y="8" width="884" height="264" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <rect x="8" y="8" width="884" height="264" rx="12" fill="url(#hudScan)" />

  <!-- Corner Brackets -->
  <path d="M16 28V16H28" stroke="#00f0ff" stroke-width="2" />
  <path d="M884 28V16H872" stroke="#00f0ff" stroke-width="2" />
  <path d="M16 252V264H28" stroke="#00f0ff" stroke-width="2" />
  <path d="M884 252V264H872" stroke="#00f0ff" stroke-width="2" />

  <!-- Title Island -->
  <g transform="translate(36, 32)">
    <circle cx="6" cy="6" r="4" fill="#00f0ff" />
    <text class="mono" x="18" y="10" font-size="11" font-weight="700" fill="#00f0ff" letter-spacing="1.5">
      // NEURAL &amp; SPATIAL SKILL SPECTRUM DIAGNOSTICS
    </text>
    <text class="mono" x="828" y="10" font-size="10" font-weight="500" fill="#64748b" text-anchor="end">
      KERNEL: COHERENT // REFRESH_RATE: 240HZ
    </text>
  </g>

  <!-- Skill Rows -->
  <!-- Row 1: AI & LLM Neural Architectures -->
  <g transform="translate(36, 70)">
    <text class="mono" x="0" y="14" font-size="12" font-weight="600" fill="#f1f5f9">AI Agents &amp; Neural Inference Pipelines</text>
    <text class="mono" x="720" y="14" font-size="11" font-weight="600" fill="#00f0ff" text-anchor="end">94% // PRODUCTION</text>
    <rect x="0" y="24" width="720" height="8" rx="4" fill="#131c2e" />
    <rect class="meter" x="0" y="24" width="676" height="8" rx="4" fill="url(#barCyan)" />
  </g>

  <!-- Row 2: Spatial 3D WebGL & Creative Physics -->
  <g transform="translate(36, 114)">
    <text class="mono" x="0" y="14" font-size="12" font-weight="600" fill="#f1f5f9">Spatial 3D WebGL &amp; GSAP Physics (Three.js)</text>
    <text class="mono" x="720" y="14" font-size="11" font-weight="600" fill="#8b5cf6" text-anchor="end">92% // AWWWARDS GRADE</text>
    <rect x="0" y="24" width="720" height="8" rx="4" fill="#131c2e" />
    <rect class="meter" x="0" y="24" width="662" height="8" rx="4" fill="url(#barPurple)" />
  </g>

  <!-- Row 3: Modern React, Next.js & TypeScript -->
  <g transform="translate(36, 158)">
    <text class="mono" x="0" y="14" font-size="12" font-weight="600" fill="#f1f5f9">Modern Full-Stack React, Next.js &amp; TypeScript</text>
    <text class="mono" x="720" y="14" font-size="11" font-weight="600" fill="#ff007f" text-anchor="end">96% // MASTERED</text>
    <rect x="0" y="24" width="720" height="8" rx="4" fill="#131c2e" />
    <rect class="meter" x="0" y="24" width="691" height="8" rx="4" fill="url(#barRose)" />
  </g>

  <!-- Row 4: Distributed Backends & Linux Systems -->
  <g transform="translate(36, 202)">
    <text class="mono" x="0" y="14" font-size="12" font-weight="600" fill="#f1f5f9">Distributed Backends &amp; Arch Linux Kernel Rice</text>
    <text class="mono" x="720" y="14" font-size="11" font-weight="600" fill="#10b981" text-anchor="end">93% // DAILY DRIVER</text>
    <rect x="0" y="24" width="720" height="8" rx="4" fill="#131c2e" />
    <rect class="meter" x="0" y="24" width="670" height="8" rx="4" fill="url(#barEmerald)" />
  </g>

  <!-- Footer Diagnostics -->
  <g transform="translate(36, 258)">
    <text class="mono" x="0" y="0" font-size="10" font-weight="500" fill="#475569">
      TELEMETRY: VERIFIED BY CONTINUOUS DEPLOYMENT • ARCH LINUX 6.11 • HYPRLAND WAYLAND • NEOVIM
    </text>
  </g>
</svg>
